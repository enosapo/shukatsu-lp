<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>エノサポ就活ボード｜学生のための就活管理ツール</title>
  <meta name="description" content="エノサポ就活ボードは学生のための就活管理ツール。企業選考の進捗・面接日程・タスクをひとつにまとめて、内定獲得まで伴走します。完全無料・30秒で登録完了。">
  <meta name="format-detection" content="telephone=no">
  <meta property="og:title" content="エノサポ就活ボード｜学生のための就活管理ツール">
  <meta property="og:description" content="企業選考の進捗・面接日程・タスクをひとつにまとめる就活管理ツール。完全無料・30秒で登録完了。">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      font-feature-settings: 'palt' 1;
      color: #333;
      background: #f3f3f3;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    img, svg { max-width: 100%; display: block; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }
    input, select, textarea { font-family: inherit; font-size: 16px; }

    .lp {
      max-width: 390px;
      margin: 0 auto;
      background: #fff;
      /* iOS Safari の URL バー表示/非表示で 100vh が大きく出すぎ footer がブラウザ chrome の下に隠れるバグ対策。
         100vh = fallback (古い browser) → 100dvh = dynamic viewport (Safari 15.4+/Chrome 108+) で動的に正しい高さ */
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow-x: hidden;
    }

    /* ========== Header ========== */
    .header {
      height: 44px;
      padding: 0 62px 0 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      background: #fff;
      position: relative;
      z-index: 10;
      white-space: nowrap;  /* Figma React: whitespace-nowrap on header — prevents tagline wrap */
    }
    .header__logo {
      font-weight: 900;
      font-size: 26px;
      line-height: 1.4;
      display: flex;
      gap: 2px;
      font-feature-settings: 'vpal' 1, 'palt' 1;
      flex-shrink: 0;
    }
    .header__logo .accent { color: #d22d26; }
    .header__tagline {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      margin-left: auto;
      text-align: left;
      color: #333;
      flex-shrink: 0;  /* Don't shrink below intrinsic content width */
    }
    .header__tagline p { color: #333; }
    .header__tagline p.accent { color: #d22d26; }

    /* ========== MV (Hero) — Figma sp_step1 (390x500 baseline) ========== */
    .mv {
      position: relative;
      width: 100%;
      height: 500px;
      background: #fff;
      overflow: hidden;
    }
    .mv__bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/hero-bg.jpg');
      background-size: 175.73% 105.98%;
      /* CSS bg-position % uses (container - image) formula, not image-left%. Converted from Figma left:-51.62%, top:-5.88% */
      background-position: 68.17% 98.33%;
      background-repeat: no-repeat;
      z-index: 0;
    }
    .mv__bg::after {
      content: '';
      position: absolute;
      inset: 0;
      /* Lighter gradient so photo texture remains visible behind heading area (Figma SP shows subtle bg) */
      background: linear-gradient(180deg,
        rgba(255,255,255,0.55) 0%,
        rgba(255,255,255,0.35) 25%,
        rgba(255,255,255,0.1) 45%,
        rgba(255,255,255,0) 55%);
    }
    .mv__inner {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .mv__heading {
      position: absolute;
      top: 5.4%;        /* 27px / 500 */
      left: 6.15%;      /* 24px / 390 */
      right: 6.15%;
      font-weight: 700;
      font-size: 50px;
      line-height: 1.4;
      color: #d22d26;
      text-align: center;
      letter-spacing: 0;
      font-feature-settings: 'vpal' 1, 'palt' 1;
      white-space: nowrap;
    }
    .mv__heading .black { color: #333; }
    .mv__sub {
      position: absolute;
      top: 19.6%;       /* 98px / 500 */
      left: 6.15%;
      right: 6.15%;
      font-weight: 700;
      font-size: 16px;
      line-height: 1.6;
      color: #333;
      text-align: center;
      font-feature-settings: 'palt' 1;
    }
    .br-pc { display: none; }
    .br-sp { display: inline; }
    .mv__ribbon {
      position: absolute;
      top: 36.8%;       /* 184px / 500 */
      left: 0;          /* full bleed left */
      right: 5.9%;      /* 23px from right */
      width: auto;
      max-width: none;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.6;
      background: #333;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%);
      padding: 0 24px 0 16px;
    }
    .mv__photo-spacer { display: none; }
    .mv__laurels {
      position: absolute;
      top: 48%;         /* 240px / 500 */
      left: 6.15%;
      right: 6.15%;
      width: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0;
      padding: 0;
    }
    .laurel {
      position: relative;
      width: 107px;
      height: 63px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .laurel__svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .laurel__text {
      display: none;
    }

    /* ========== Board ========== */
    .board__title {
      position: relative;
      background: linear-gradient(122.45deg, #d22d26 51.679%, #b0241e 51.679%);
      color: #fff;
      text-align: center;
      padding: 25px 24px 16px;  /* Figma SP: visible red box 104px tall (h2 33.6 + gap 4 + p 25.6 + pad 25+16 ≈ 104) */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 0;
    }
    .board__bubble {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      width: 202px;
      height: 40px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .board__bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 10px solid #fff;
    }
    .board__bubble-free {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 26px;
      padding: 0 8px;
      background: linear-gradient(143.93deg, #371d0f 25.287%, #dec06b 49.323%, #371d0f 74.142%);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      line-height: 1;
    }
    .board__bubble-text {
      color: #333;
      font-weight: 700;
      font-size: 16px;
      line-height: 1.2;
    }
    .board__title h2 {
      font-weight: 700;
      font-size: 24px;
      line-height: 1.4;
      color: #fff;
    }
    .board__title p {
      font-weight: 400;
      font-size: 16px;
      line-height: 1.6;
    }

    .board__contents {
      background: #fff;
      box-shadow: 0 16px 64px rgba(51,51,51,0.08);
      padding: 24px 24px 48px;
    }

    /* ========== Wizard / Steps ========== */
    .step { display: none; border: none; }
    .step.active {
      display: flex;
      flex-direction: column;
      gap: 24px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .progress {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress__label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .progress__label .name {
      font-weight: 700;
      font-size: 16px;
      line-height: 1.2;
      color: #d22d26;
    }
    .progress__label .count {
      font-weight: 400;
      font-size: 14px;
      line-height: 1.2;
      color: #333;
    }
    .progress__bar {
      width: 100%;
      height: 8px;
      background: #ddd;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress__fill {
      height: 100%;
      background: #d22d26;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .question {
      font-weight: 700;
      font-size: 16px;
      line-height: 1.5;
      color: #333;
    }
    .question .accent { color: #d22d26; }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .choice-btn {
      width: 100%;
      min-height: 56px;
      padding: 16px 24px;
      background: #333;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      line-height: 1.4;
      border-radius: 16px;
      box-shadow: 0 4px 8px rgba(51,51,51,0.4);
      text-align: left;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
    }
    .choice-btn:hover { transform: translateY(-1px); }
    .choice-btn:active { transform: translateY(1px); box-shadow: 0 2px 4px rgba(51,51,51,0.4); }
    .choice-btn.selected {
      background: #d22d26;
      box-shadow: 0 4px 8px rgba(210,45,38,0.4);
    }

    .step__title-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .lock {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #333;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
    }
    .lock svg { width: 16px; height: 16px; flex-shrink: 0; }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-label {
      display: flex;
      gap: 6px;
      align-items: center;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.2;
      color: #333;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 20px;
      padding: 0 6px;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      line-height: 1.2;
    }
    .badge.required { background: #d22d26; }
    .badge.optional { background: #333; }

    .input, .select {
      width: 100%;
      height: 56px;
      padding: 16px 20px;
      background: #fff;
      border: 2px solid #ddd;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.4;
      color: #333;
      font-weight: 400;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .input::placeholder {
      color: #999;
    }
    .input:focus, .select:focus {
      border-color: #d22d26;
    }
    .input.error, .select.error {
      border-color: #d22d26;
      background: #fff5f5;
    }
    .select {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 18px center;
      padding-right: 48px;
    }

    .error-msg {
      color: #d22d26;
      font-size: 13px;
      line-height: 1.4;
      margin-top: 4px;
    }

    .terms {
      text-align: center;
      font-weight: 400;
      font-size: 14px;
      line-height: 1.6;
    }
    .terms a .accent {
      color: #d22d26;
      text-decoration: underline;
    }

    .cta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px 16px;
      background: #d22d26;
      border-radius: 16px;
      box-shadow: 0 4px 8px rgba(210,45,38,0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-submit:hover { transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(1px); box-shadow: 0 2px 4px rgba(210,45,38,0.4); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .btn-submit__inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-submit__free {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(142.74deg, #371d0f 21.679%, #dec06b 48.623%, #371d0f 76.445%);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-align: center;
    }
    .btn-submit__text {
      display: flex;
      flex-direction: column;
      color: #fff;
      text-align: left;
      gap: 2px;
    }
    .btn-submit__text .small {
      font-weight: 400;
      font-size: 12px;
      line-height: 1.2;
    }
    .btn-submit__text .big {
      font-weight: 700;
      font-size: 16px;
      line-height: 1.3;
    }
    .btn-submit__arrow {
      color: #fff;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .cta-sub {
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
      color: #333;
      font-weight: 400;
    }

    .controler {
      display: flex;
      gap: 12px;
    }
    .btn-back, .btn-next {
      height: 48px;
      padding: 12px 20px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.4;
      transition: transform 0.1s ease;
    }
    .btn-back {
      width: 80px;
      background: #ddd;
      color: #333;
      flex-shrink: 0;
    }
    .btn-next {
      flex: 1;
      background: #d22d26;
      border: 1px solid #d22d26;
      color: #fff;
      box-shadow: 0 4px 8px rgba(210,45,38,0.4);
    }
    .btn-back:active, .btn-next:active { transform: translateY(1px); }
    .btn-next:disabled {
      background: #f3a4a1;
      border-color: #f3a4a1;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* ========== Footer (Figma SP: 390x227, py-64, gap-16) ========== */
    .footer {
      background: #fff;
      padding: 64px 24px;
      /* iPhone home indicator / Safari ツールバー 領域分の余裕を確保 (footer 末尾が chrome 下に隠れないように) */
      padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .footer__logo {
      font-weight: 900;
      font-size: 20px;
      line-height: 1.4;
      display: flex;
      gap: 2px;
      font-feature-settings: 'vpal' 1, 'palt' 1;
    }
    .footer__logo .accent { color: #d22d26; }
    .footer__nav {
      font-weight: 400;
      font-size: 14px;
      line-height: 1.6;
      color: #333;
      text-align: center;
    }
    .footer__nav a {
      color: inherit;
      text-decoration: underline;
    }
    .footer__copy {
      font-weight: 400;
      font-size: 12px;
      line-height: 1.4;
      color: #333;
      text-align: center;
    }

    /* ========== PC (≥768px) — values from Figma pc_step1 (1440 baseline) ========== */
    @media (min-width: 768px) {
      /* Body は中性グレー背景。1920+ モニターで LP (max 1440) が中央寄せされ両脇に余白が出る雑誌レイアウト風 */
      body { background: #f3f3f3; }
      .lp {
        max-width: 1440px;
        margin: 0 auto;
        background: #fff;
        overflow-x: hidden;
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.06);  /* LP の境界を控えめに示す */
      }

      /* Header: 64px tall, horizontal padding 140px (matches MV padding-left) */
      .header {
        max-width: 1440px;
        margin: 0 auto;
        height: 64px;
        padding: 0 clamp(40px, 9.72vw, 140px);
        background: #fff;
        position: relative;
        z-index: 20;
      }
      .header__logo {
        font-size: clamp(20px, 1.81vw, 26px);
        font-weight: 900;
      }
      .header__logo > * { line-height: 1.4; }
      .header__tagline {
        font-size: clamp(13px, 1.11vw, 16px);
        font-weight: 700;
        line-height: 1.2;
        text-align: right;
        color: #333;
      }
      .header__tagline p { display: inline; color: #333; }
      .header__tagline p.accent { color: #d22d26; }

      /* MV: full-bleed background, anchored left-bottom (Figma: 118.75% auto, 0 -143.46%) */
      .mv {
        position: relative;
        width: 100%;
        height: clamp(420px, 37.7vw, 543px);
        overflow: hidden;
        background: #fff;
      }
      .mv__bg {
        position: absolute;
        inset: 0;
        background-image: url('assets/hero-bg.jpg');
        background-size: 118.75% 243.49%;
        background-position: left bottom;
        background-repeat: no-repeat;
      }
      .mv__bg::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to right,
          rgba(255,255,255,0.85) 0%,
          rgba(255,255,255,0.55) 30%,
          rgba(255,255,255,0.15) 48%,
          rgba(255,255,255,0) 60%);
      }
      .mv__inner {
        position: relative;
        inset: auto;
        z-index: 1;
        max-width: 1440px;
        margin: 0 auto;
        padding: clamp(55px, 5.21vw, 75px) 40px 0 clamp(100px, 9.72vw, 140px);
        display: flex;
        flex-direction: column;
        align-items: flex-start !important;
        text-align: left !important;
        gap: 0;
      }
      .mv__heading {
        position: static;
        top: auto; left: auto; right: auto;
        font-size: clamp(60px, 5.69vw, 82px);
        line-height: 1.2;
        text-align: left !important;
        letter-spacing: 0;
        align-self: flex-start;
        max-width: none;
        white-space: nowrap;
        margin: 0;
      }
      .mv__sub {
        position: static;
        top: auto; left: auto; right: auto;
        font-size: clamp(15px, 1.39vw, 20px);
        line-height: 1.6;
        text-align: left !important;
        align-self: flex-start;
        max-width: none;
        font-weight: 700;
        color: #333;
        margin-top: 8px;
      }
      .br-pc { display: inline; }
      .br-sp { display: none; }
      .mv__ribbon {
        position: static;
        top: auto; left: auto; right: auto;
        width: clamp(420px, 38.06vw, 548px);
        max-width: none;
        height: clamp(48px, 3.89vw, 56px);
        font-size: clamp(16px, 1.39vw, 20px);
        font-weight: 700;
        background: #333;
        /* Right-pointing arrow tail */
        clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%);
        padding: 0 32px 0 20px;
        justify-content: flex-start;
        align-self: flex-start;
        margin-top: 16px;
      }
      .mv__photo-spacer { display: none; }
      .mv__laurels {
        position: static;
        top: auto; left: auto; right: auto;
        width: 100%;
        max-width: clamp(380px, 34.72vw, 500px);
        justify-content: space-between;
        gap: 0;
        padding: 0;
        align-self: flex-start;
        margin-top: 16px;
      }
      .laurel {
        width: clamp(120px, 10.83vw, 156px);
        height: clamp(72px, 6.42vw, 92.5px);
      }

      /* Board: 960 wide, centered, overlaps hero by 46px */
      .board {
        position: relative;
        z-index: 5;
        background: transparent;
        padding: 0;
        max-width: clamp(720px, 66.67vw, 960px);
        margin: clamp(-46px, -3.19vw, -28px) auto 40px;
        box-shadow: 0 24px 64px rgba(0,0,0,0.15);
      }
      .board__title {
        max-width: none;
        margin: 0;

<script>
  // shukatsu-board 集客 LP — CV は board/signup へのリンク遷移のみ（CRM intake は使わない）。
  // クリック時に流入クエリ（utm_*, gclid 等）を遷移先 URL に引き継ぐ。
  const signupBtn = document.getElementById('signup-btn');
  if (signupBtn) {
    signupBtn.addEventListener('click', (e) => {
      const params = new URLSearchParams(window.location.search);
      if (params.toString()) {
        const url = new URL(signupBtn.href);
        params.forEach((v, k) => { if (!url.searchParams.has(k)) url.searchParams.set(k, v); });
        signupBtn.href = url.toString();
      }
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'lp_cta_click', lp_name: 'shukatsu-board' });
    });
  }
</script>
